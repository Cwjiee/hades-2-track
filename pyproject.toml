[project]
name = "hades-track"
version = "0.1.0"
description = "Automatic Hades II run journal for an Obsidian vault"
requires-python = ">=3.10"
dependencies = ["lz4>=4.3"]

[project.scripts]
hades-track = "hades_track.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hades_track"]
